name: Snapshot performance

on:
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:
    inputs:
      scenario:
        description: Synthetic immutable-snapshot scenario
        required: true
        default: balanced-1m
        type: choice
        options:
          - balanced-1m
          - wide-1m
          - balanced-5m

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  snapshot-review:
    name: Snapshot review (${{ inputs.scenario || 'balanced-1m' }})
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master, pinned 2026-07-15
        with:
          toolchain: 1.96.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: snapshot-performance

      - name: Compile isolated Release fixture
        run: cargo test --release -p dux-core --lib --no-run --locked

      - name: Run isolated snapshot fixture
        shell: bash
        env:
          SCENARIO: ${{ inputs.scenario || 'balanced-1m' }}
        run: |
          mkdir -p target/snapshot-performance
          case "$SCENARIO" in
            balanced-1m)
              nodes=1000000
              shape=balanced
              ;;
            wide-1m)
              nodes=1000000
              shape=wide
              ;;
            balanced-5m)
              nodes=5000000
              shape=balanced
              ;;
            *)
              echo "Unsupported scenario: $SCENARIO" >&2
              exit 2
              ;;
          esac
          set -o pipefail
          DUX_SNAPSHOT_PERF_NODES="$nodes" \
          DUX_SNAPSHOT_PERF_SHAPE="$shape" \
          /usr/bin/time -l \
            cargo test --release -p dux-core --lib --locked \
              engine::registry::snapshot_performance_tests::million_node_snapshot_review_performance_fixture \
              -- --ignored --exact --nocapture --test-threads=1 \
            2>&1 | tee "target/snapshot-performance/$SCENARIO.log"

      - name: Upload performance observation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snapshot-performance-${{ inputs.scenario || 'balanced-1m' }}-${{ github.run_id }}
          path: target/snapshot-performance/*.log
          if-no-files-found: error
          retention-days: 30
