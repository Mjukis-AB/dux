[workspace]
resolver = "2"
members = ["dux-core", "dux-cli", "dux-ffi"]
exclude = ["fuzz"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
authors = ["Mjukis AB"]
license = "MIT"
repository = "https://github.com/mjukis-ab/dux"
homepage = "https://github.com/mjukis-ab/dux"
description = "An interactive, DaisyDisk-like terminal disk usage analyzer"

[workspace.dependencies]
# Core dependencies
jwalk = "0.8"
crossbeam-channel = "0.5"
fs4 = { version = "=1.1.0", default-features = false, features = ["sync"] }
getrandom = "=0.3.4"
rusqlite = { version = "=0.39.0", default-features = false, features = ["bundled", "extra_check", "hooks", "limits"] }
sha2 = { version = "=0.10.9", default-features = false }

# CLI dependencies
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache", "underline-color"] }
crossterm = "0.29"
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"

# Shared
thiserror = "2"
uniffi = "=0.31.2"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[workspace.lints.clippy]
disallowed_methods = "deny"

# Cargo executable attestation hashes the complete signed binary more than once
# at independent authority boundaries. Keep application code debuggable while
# avoiding multi-minute software SHA-256 passes in Debug builds and tests.
[profile.dev.package.sha2]
opt-level = 3

[profile.test.package.sha2]
opt-level = 3
