[package]
name = "dux-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core library for DUX disk usage analyzer - tree data structures and parallel scanning"
keywords = ["disk", "usage", "filesystem", "scanner"]
categories = ["filesystem", "command-line-utilities"]

[dependencies]
jwalk = { workspace = true }
crossbeam-channel = { workspace = true }
thiserror = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.0", features = ["alloc"] }
crc32fast = "1.3"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", default-features = false, features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.31", default-features = false, features = ["fs", "mount"] }

[dev-dependencies]
tempfile = "3"

[[example]]
name = "debug_scan"
path = "../debug_scan.rs"
