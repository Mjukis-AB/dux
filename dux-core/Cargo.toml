[package]
name = "dux-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core library for DUX disk usage analyzer - tree data structures and parallel scanning"
keywords = ["disk", "usage", "filesystem", "scanner"]
categories = ["filesystem", "command-line-utilities"]

[dependencies]
jwalk = { workspace = true }
crossbeam-channel = { workspace = true }
thiserror = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postcard = { version = "1.0", default-features = false, features = ["alloc"] }
crc32fast = "1.3"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", default-features = false, features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.31", default-features = false, features = ["fs", "mount"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[dev-dependencies]
jsonschema = { version = "0.47.0", default-features = false }
tempfile = "3"
