name: Dux

options:
  minimumXcodeGenVersion: 2.44.1
  createIntermediateGroups: true
  defaultConfig: Debug
  deploymentTarget:
    macOS: "14.0"

configs:
  Debug: debug
  Release: release
  CleanupQualification: release

schemes:
  Dux:
    build:
      targets:
        Dux: all
        DuxTests: [test]
    test:
      targets:
        - DuxTests
  DuxICloudReadOnlyQualification:
    build:
      targets:
        DuxICloudQualificationTests: [test]
    test:
      targets:
        - DuxICloudQualificationTests

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.5

targets:
  Dux:
    type: application
    platform: macOS
    productName: DUX
    sources:
      - path: Dux
    postCompileScripts:
      - name: Embed verified bundled CLI
        script: |
          "$SRCROOT/scripts/embed-verified-bundled-cli.sh"
        inputFiles:
          - "$(SRCROOT)/Generated/dux-cli-bundled"
          - "$(SRCROOT)/Generated/dux-cli-bundled-metadata.json"
          - "$(SRCROOT)/scripts/finalize-bundled-cli-metadata.py"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/dux-cli-bundled"
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/dux-cli-bundled-metadata.json"
        basedOnDependencyAnalysis: false
    dependencies:
      - framework: Generated/DuxFFI.xcframework
        embed: false
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.mjukis.dux.spike
        PRODUCT_NAME: DUX
        DUX_DISPLAY_NAME: DUX
        DUX_CLEANUP_QUALIFICATION_PROTOCOL_VERSION: "0"
        DUX_CLEANUP_QUALIFICATION_SOURCE_COMMIT: none
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "$(DUX_DISPLAY_NAME)"
        INFOPLIST_KEY_LSUIElement: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: YES
        DEAD_CODE_STRIPPING: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DUX_INTERNAL_PERMANENT_SAFE_CLEANUP"
        Release:
          CODE_SIGN_ENTITLEMENTS: Config/Release.entitlements
          DEVELOPMENT_TEAM: SMQ3E8Y57T
          PRODUCT_BUNDLE_IDENTIFIER: se.mjukis.dux
        CleanupQualification:
          CODE_SIGN_ENTITLEMENTS: Config/Release.entitlements
          DEVELOPMENT_TEAM: SMQ3E8Y57T
          PRODUCT_BUNDLE_IDENTIFIER: se.mjukis.dux
          DUX_DISPLAY_NAME: DUX Cleanup Qualification
          DUX_CLEANUP_QUALIFICATION_PROTOCOL_VERSION: "1"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DUX_INTERNAL_PERMANENT_SAFE_CLEANUP DUX_CLEANUP_QUALIFICATION"

  DuxTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DuxTests
    dependencies:
      - target: Dux
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.mjukis.dux.spike.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DUX.app/Contents/MacOS/DUX"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete

  DuxICloudQualificationTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Dux/Services/ICloudLocalCopyRawFactReader.swift
      - path: DuxICloudQualificationTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.mjukis.dux.icloud-read-only-qualification.tests
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DUX_ICLOUD_READ_ONLY_QUALIFICATION"
